<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="vqHAAuGhtUuZQ5qOJ5jbuyvZW2jHX85qVem7H3OTULE" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squadflix - Professional Anime Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #141414;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 1px;
        }
        .search-box input {
            padding: 10px 20px;
            width: 300px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #222;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: #e50914;
            width: 350px;
        }
        .container {
            flex: 1;
            padding: 40px 50px;
        }
        h2 {
            margin-bottom: 25px;
            font-size: 24px;
            border-left: 4px solid #e50914;
            padding-left: 12px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }
        .card {
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.3);
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }
        .card-body h3 {
            font-size: 15px;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn {
            display: block;
            text-align: center;
            background-color: #e50914;
            color: white;
            padding: 8px 0;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #b20710;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #000;
            color: #777;
            font-size: 14px;
            margin-top: auto;
        }
        @media(max-width: 768px) {
            header { padding: 15px 20px; }
            .container { padding: 20px; }
            .search-box input { width: 180px; }
            .search-box input:focus { width: 220px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SQUADFLIX</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search anime..." onkeyup="searchAnime()">
        </div>
    </header>

    <div class="container">
        <h2>Complete Anime Library</h2>
        <div class="grid" id="animeGrid"></div>
    </div>

    <footer>
        <p>&copy; 2026 Squadflix. All Rights Reserved.</p>
    </footer>

    <!-- Database File Link -->
    <script src="anime-data.js"></script>
    <script>
        function displayAnime(list) {
            let grid = document.getElementById('animeGrid');
            grid.innerHTML = "";
            
            list.forEach(anime => {
                let searchUrl = `https://www.google.com/search?q=${encodeURIComponent(anime.title + " anime download english sub dub")}`;
                let card = `
                    <div class="card" data-title="${anime.title.toLowerCase()}">
                        <img src="${anime.image}" alt="${anime.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop&q=60'">
                        <div class="card-body">
                            <h3>${anime.title}</h3>
                            <a href="${searchUrl}" target="_blank" class="btn">Download / Stream</a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Initial Load
        displayAnime(animeList);

        // Real-time Search Logic
        function searchAnime() {
            let input = document.getElementById('searchInput').value.toLowerCase().trim();
            let cards = document.getElementsByClassName('card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
